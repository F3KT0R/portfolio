name: Quality

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint (ESLint, Stylelint, architecture, colour tokens)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (engine, content integrity)
        run: npm test
      - name: Build
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (routes, axe, no-JS, game layer)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
